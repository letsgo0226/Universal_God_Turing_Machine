name: UGTM Continuous Verification and Optional GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every day at 08:17 Taiwan time (UTC+08); verification only.
    - cron: '17 0 * * *'

permissions:
  contents: read

concurrency:
  group: ugtm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify both cores and cross-language trace replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged UGTM and ATGC reference cores
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Universal_God_Turing_Machine.sh)" = '23c7bdcc123bcdec8c7ee21f8e4cb07881ccf34d'
          test "$(git hash-object lfp_atgc_tm_2kb.sh)" = '70b8423d3b5f254ce3011336b868edc20674b8bd'
          sh Universal_God_Turing_Machine.sh > /tmp/ugtm.json
          python3 -c 'import json; r=json.load(open("/tmp/ugtm.json")); assert r["closed_sample"]=="S" and r["input_sample"]=="A"'
          sh lfp_atgc_tm_2kb.sh > /tmp/atgc.json
          python3 -c 'import json; r=json.load(open("/tmp/atgc.json")); assert r["prototype"]["code"]==341 and r["candidates"]==387'
          python3 tools/verify_trace.py --self-test
          node tools/ai_seed.js --self-test
          node tools/seed_cognition.js --self-test
          node tools/seed_github_ledger.js --self-test
          node tools/test_browser.js
          python3 tools/verify_trace.py /tmp/ugtm-browser-certificate.json
          python3 tools/test_differential.py
      - name: Audit published Render revision (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          python3 tools/audit_deploy.py --expected-sha "$(git rev-parse HEAD)" --warn-only
      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          {
            echo '## UGTM bounded verification'
            echo ''
            echo 'Reference core and finite cross-language tests are checked by the preceding step.'
            echo 'A successful run is **not** a proof of the halting problem or personal immortality.'
            echo 'Research ethics charter: [Where We Will Be Going](docs/WHERE_WE_WILL_BE_GOING.md).'
          } >> "$GITHUB_STEP_SUMMARY"

  pages-status:
    name: Detect optional GitHub Pages (does not block verification)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - name: Check whether Pages is configured for GitHub Actions
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --output /tmp/ugtm-pages-status.json --write-out '%{http_code}' --header "Accept: application/vnd.github+json" --header "Authorization: Bearer ${GH_TOKEN}" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [[ "$status" == 404 ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled. CI passed; Render is the active publisher. To enable optional Pages, select GitHub Actions in Settings > Pages."
          elif [[ "$status" == 200 ]]; then
            mode="$(python3 -c 'import json; print(json.load(open("/tmp/ugtm-pages-status.json")).get("build_type",""))')"
            if [[ "$mode" == workflow ]]; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
            else
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo "::notice::Pages build source is not GitHub Actions; optional Pages publish skipped."
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages query returned HTTP ${status}; optional publication skipped."
          fi

  deploy-pages:
    name: Publish optional GitHub Pages
    if: needs['pages-status'].outputs.enabled == 'true'
    needs: [verify, pages-status]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      issues: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generate bounded research and academic snapshots for GitHub Pages
        run: |
          node tools/ai_seed.js --write
          node tools/seed_scholar.js --write
      - name: Read last verified GitHub-native memory ledger entry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/seed_github_ledger.js --read
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
